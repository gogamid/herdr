name: Android Termux

# Builds a native Android (bionic, PIE) herdr binary for Termux on aarch64
# phones. No proot needed: Rust target aarch64-linux-android linked with the
# Android NDK clang, zig builds the vendored libghostty-vt for
# aarch64-linux-android (see build.rs zig_target mapping).
#
# Run manually with: gh workflow run android-termux.yml --ref android-termux
# Then download: gh run download <run-id> --repo gogamid/herdr

on:
  workflow_dispatch:
  push:
    branches: [android-termux]
    paths:
      - '.github/workflows/android-termux.yml'
      - 'build.rs'
      - 'android_tls_fix.c'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'vendor/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Set Android linker
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$CLANG" --version
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android-aarch64-linux-android

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target aarch64-linux-android --verbose

      - name: Debug Android TLS
        if: always()
        run: |
          echo "=== OUT_DIR TLS object ==="
          OBJ=$(find target/aarch64-linux-android -name "android_tls_fix.o" | head -n1)
          ls -lh "$OBJ" 2>&1
          echo "--- readelf -S object ---"
          readelf -S "$OBJ" 2>&1
          echo "--- readelf -s object ---"
          readelf -s "$OBJ" 2>&1 | head -n 20
          echo "--- llvm-readelf object ---"
          llvm-readelf --sections "$OBJ" 2>&1 | head -n 30
          echo "=== final binary TLS ==="
          readelf -l target/aarch64-linux-android/release/herdr 2>&1 | grep -E "TLS|Type|LOAD"
          readelf -S target/aarch64-linux-android/release/herdr 2>&1 | grep -i tls | head -n 10
          echo "=== nm TLS symbol ==="
          llvm-nm target/aarch64-linux-android/release/herdr 2>&1 | grep -i "tls\|herdr_tls" | head -n 20 || nm target/aarch64-linux-android/release/herdr 2>&1 | grep -i "tls\|herdr_tls" | head -n 20
          echo "=== readelf -l TLS detail ==="
          readelf -l target/aarch64-linux-android/release/herdr 2>&1 | grep -A2 TLS

      - name: Verify Android binary
        run: |
          file target/aarch64-linux-android/release/herdr
          if file target/aarch64-linux-android/release/herdr | grep -qi 'pie executable\|shared object'; then
            echo "PIE OK: binary is position-independent, runs natively on Android"
          else
            echo "::error::binary is not PIE - will not run on Android without proot"
            exit 1
          fi

      - name: Rename binary
        run: cp target/aarch64-linux-android/release/herdr herdr-termux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-termux-aarch64
          path: herdr-termux-aarch64
