name: Android Termux

# Builds a native Android (bionic, PIE) herdr binary for Termux on aarch64
# phones. No proot needed: Rust target aarch64-linux-android + cargo-zigbuild
# (zig as linker) + the vendored libghostty-vt compiled for
# aarch64-linux-android (see build.rs zig_target mapping).
#
# Run manually with: gh workflow run android-termux.yml --ref android-termux
# Then download: gh run download <run-id> --repo gogamid/herdr

on:
  workflow_dispatch:
  push:
    branches: [android-termux]
    paths:
      - '.github/workflows/android-termux.yml'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'vendor/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android-aarch64-linux-android

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo zigbuild --release --locked --target aarch64-linux-android

      - name: Verify Android binary
        run: |
          file target/aarch64-linux-android/release/herdr
          if file target/aarch64-linux-android/release/herdr | grep -qi 'pie executable\|shared object'; then
            echo "PIE OK: binary is position-independent, runs natively on Android"
          else
            echo "::error::binary is not PIE - will not run on Android without proot"
            exit 1
          fi

      - name: Rename binary
        run: cp target/aarch64-linux-android/release/herdr herdr-termux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-termux-aarch64
          path: herdr-termux-aarch64
